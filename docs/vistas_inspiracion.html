<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaca · Boletaje de Autobuses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB;--card:#fff;--ink:#0F1B3D;--mut:#5B6785;--line:#E3E8F2;--soft:#EEF2FA;
  --pri:#1E3A8A;--pri-2:#3B82F6;--on-pri:#fff;--acc:#F59E0B;--on-acc:#241600;
  --ok:#15803D;--ok-bg:#DCFCE7;--bad:#DC2626;--bad-bg:#FEE2E2;--warn:#B45309;--warn-bg:#FEF3C7;--info-bg:#DBEAFE;
  --seat-free:#EAF7EF;--seat-free-b:#86D1A3;--seat-occ:#F1F3F8;--seat-occ-b:#CBD2E1;--seat-res:#FEF3C7;--seat-res-b:#E0A21B;
  --shadow:0 1px 2px rgba(15,27,61,.06),0 8px 24px rgba(15,27,61,.06);--r:14px;
  --f-h:'Outfit',system-ui,sans-serif;--f-b:'Work Sans',system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0A1022;--card:#121B36;--ink:#E8EDFA;--mut:#93A0C2;--line:#222E52;--soft:#18234A;
  --pri:#6EA0FF;--pri-2:#8DB4FF;--on-pri:#0A1022;--acc:#FBBF24;--on-acc:#241600;
  --ok:#4ADE80;--ok-bg:#12351F;--bad:#F87171;--bad-bg:#3B1618;--warn:#FBBF24;--warn-bg:#3A2A0A;--info-bg:#17294F;
  --seat-free:#12301F;--seat-free-b:#2F8F57;--seat-occ:#1A2340;--seat-occ-b:#33406B;--seat-res:#3A2A0A;--seat-res-b:#B7791F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
h1,h2,h3,.h{font-family:var(--f-h);font-weight:600;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}
.mut{color:var(--mut)}.sm{font-size:13px}.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri-2);outline-offset:2px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.s{width:16px;height:16px}.i.l{width:28px;height:28px}

/* layout */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri-2));color:#fff;display:grid;place-items:center}
.brand b{font:600 19px var(--f-h);display:block;line-height:1.1}.brand span{font-size:12px;color:var(--mut)}
.nav-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);text-decoration:none;cursor:pointer;min-height:44px;transition:background .18s,color .18s}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{background:var(--pri);color:var(--on-pri);font-weight:500}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--soft)}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font:600 14px var(--f-h)}
.wrap{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
main{padding:28px;max-width:1280px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{color:var(--mut);margin-top:2px}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card>.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.g{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-7-5{grid-template-columns:1.4fr 1fr}.g-8-4{grid-template-columns:1.7fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:500;transition:transform .12s,background .18s,box-shadow .18s;background:var(--pri);color:var(--on-pri)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.ico{padding:0;width:44px}.btn.sm.ico{width:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:500;background:var(--soft);color:var(--mut)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--pri)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--mut)}
.in{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;width:100%}
.in:focus{border-color:var(--pri-2)}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font:600 32px var(--f-h)}
.kpi .t{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.kpi .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--pri)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri-2);border-radius:99px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--soft)}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;min-height:36px;color:var(--mut)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* login */
#login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:linear-gradient(150deg,#12286b,#1E3A8A 55%,#2f63d4);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero h1{font-size:42px;line-height:1.1;max-width:460px}
.hero p{max-width:420px;opacity:.85;margin-top:14px}
.hero svg.route{position:absolute;right:-30px;bottom:40px;width:78%;opacity:.95}
.formside{display:grid;place-items:center;padding:32px}
.formbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rolebtn{border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;color:var(--mut);min-height:76px}
.rolebtn.on{border-color:var(--pri);color:var(--pri);background:var(--soft);font-weight:500}

/* search results */
.trip{display:grid;grid-template-columns:130px 1fr 150px;gap:20px;align-items:center}
.time{font:600 30px var(--f-h)}
.line{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding-top:2px}
.line::before{content:"";position:absolute;left:6px;right:6px;top:8px;height:2px;background:var(--line)}
.line span{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut);text-align:center;max-width:78px}
.line span::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--pri-2)}
.line span.e::before{background:var(--pri-2)}
.price{font:600 26px var(--f-h)}

/* sale */
.stops{display:flex;gap:0;align-items:flex-start;margin:6px 0 4px}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:4px 2px;font-size:12px;color:var(--mut);position:relative;min-height:60px}
.stp::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:4px;background:var(--line)}
.stp:first-child::before{display:none}
.stp.in::before{background:var(--pri-2)}
.stp b{width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--line);position:relative;z-index:1}
.stp.in b{border-color:var(--pri-2)}.stp.end b{background:var(--pri-2)}
.stp.on{color:var(--ink);font-weight:500}
.busbox{border:2px solid var(--line);border-radius:36px 36px 18px 18px;padding:18px 22px 22px;max-width:330px;margin:12px auto 0;background:var(--soft)}
.cab{display:flex;justify-content:space-between;align-items:center;padding:0 6px 12px;color:var(--mut);font-size:12px;border-bottom:2px dashed var(--line);margin-bottom:14px}
.seats{display:grid;grid-template-columns:repeat(2,1fr) 22px repeat(2,1fr);gap:9px}
.seat{height:46px;border-radius:10px 10px 6px 6px;border:2px solid var(--seat-free-b);background:var(--seat-free);font:600 14px var(--f-h);cursor:pointer;transition:transform .12s,background .18s}
.seat:hover:not(:disabled){transform:translateY(-2px)}
.seat:disabled{background:var(--seat-occ);border-color:var(--seat-occ-b);color:var(--mut);cursor:not-allowed;background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(120,130,160,.18) 5px 7px)}
.seat.sel{background:var(--pri);border-color:var(--pri);color:var(--on-pri);transform:translateY(-2px)}
.seat.res:disabled{background:var(--seat-res);border-color:var(--seat-res-b);color:var(--warn);background-image:none}

/* vistas de referencia */
.side{overflow-y:auto}
td.num{white-space:nowrap}
.trip-d{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.trip-d small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.trip-d b{font:600 17px var(--f-h)}
.cnt{display:flex;gap:10px;flex-wrap:wrap}
.cnt div{flex:1;min-width:90px;border-radius:12px;padding:10px 12px;background:var(--soft)}
.cnt div b{display:block;font:600 24px var(--f-h)}
.sw{position:relative;width:42px;height:24px;border-radius:99px;background:var(--line);border:0;cursor:pointer;flex-shrink:0;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{transform:translateX(18px)}
.seq{display:flex;flex-direction:column}
.seq div{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;position:relative}
.seq div::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.seq div:first-child::before{top:50%}.seq div:last-child::before{bottom:50%}
.seq i{width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--pri-2);position:relative;z-index:1;margin-left:6px}
.seq div:first-child i,.seq div:last-child i{background:var(--pri-2)}
.mx td,.mx th{text-align:center;padding:9px 6px}.mx th:first-child,.mx td:first-child{text-align:left}
.mx td.z{color:var(--line)}
.sel-card{cursor:pointer;border:1.5px solid var(--line);transition:border-color .18s}
.sel-card.on{border-color:var(--pri);background:var(--soft)}
.layout-mini{display:grid;gap:4px;margin-top:10px}
.layout-mini span{height:10px;border-radius:3px;background:var(--seat-free-b);opacity:.7}
.layout-mini span.g{background:none}
.hb{display:grid;grid-template-columns:160px 1fr 70px;gap:12px;align-items:center;margin-bottom:12px;font-size:14px}
.hb .bar{height:12px}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mut);margin-top:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid;margin-right:6px;vertical-align:-1px}
.sum{display:flex;justify-content:space-between;padding:8px 0}
.sum.t{border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;font:600 22px var(--f-h)}

/* ticket */
.ticket{display:grid;grid-template-columns:1fr 220px;max-width:760px;margin:auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;position:relative}
.ticket .l{padding:28px}
.ticket .r{border-left:2px dashed var(--line);padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--soft)}
.ticket::before,.ticket::after{content:"";position:absolute;right:199px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-12px}.ticket::after{bottom:-12px}
.tk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.tk-route{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.tk-route .c{font:600 28px var(--f-h)}
.tk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tk-grid small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tk-grid b{font:600 17px var(--f-h)}
.qr{background:#fff;padding:10px;border-radius:10px}

/* fleet */
.unit{display:flex;flex-direction:column;gap:12px}
.unit .top2{display:flex;justify-content:space-between;align-items:flex-start}
.unit .ibig{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--pri)}
.unit.m .ibig{background:var(--bad-bg);color:var(--bad)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--mut)}.meta b{display:block;color:var(--ink);font:600 15px var(--f-h)}

/* infra */
.topo{width:100%;height:auto}
.topo text{font:500 12px var(--f-b);fill:var(--ink)}.topo .s{fill:var(--mut);font-size:11px}
.topo .bx{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.topo .hot{stroke:var(--ok);stroke-width:2}
.topo .ln{stroke:var(--line);stroke-width:2;fill:none}.topo .fl{stroke:var(--pri-2);stroke-width:2.5;fill:none;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.tl{display:flex;flex-direction:column;gap:14px}
.tl div{display:flex;gap:12px}.tl .d{margin-top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri-2);flex-shrink:0}
.tl .d.ok{background:var(--ok)}.tl .d.bad{background:var(--bad)}.tl .d.warn{background:var(--acc)}
.perm td:not(:first-child),.perm th:not(:first-child){text-align:center}
.perm .y{color:var(--ok)}.perm .n{color:var(--line)}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw;display:flex;gap:10px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.view{animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:1000px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g-7-5,.g-8-4{grid-template-columns:1fr}
  .trip-d{grid-template-columns:repeat(3,1fr)}.hb{grid-template-columns:110px 1fr 60px}
  .trip{grid-template-columns:1fr}.ticket{grid-template-columns:1fr}.ticket .r{border-left:0;border-top:2px dashed var(--line)}.ticket::before,.ticket::after{display:none}
}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;z-index:10;border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .side .brand,.side .me,.nav-l{display:none}
  .nav{display:flex;gap:2px;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-width:58px;text-align:center}
  main{padding:18px 16px 96px}.top{padding:12px 16px}
  #login{grid-template-columns:1fr}.hero{min-height:260px;padding:28px}.hero h1{font-size:30px}.hero svg.route{display:none}
  .g2{grid-template-columns:1fr}
}
</style>
</head>

<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-6h16v6h-3M7 14h10v7H7z"/></symbol>

  <aside class="side">

      <button class="btn ghost ico sm" data-act="theme" aria-label="Cambiar tema"><svg class="i" id="themeic"><use href="#i-moon"/></svg></button>
      <button class="btn ghost sm" data-act="go" data-v="login"><svg class="i s"><use href="#i-logout"/></svg>Salir</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const money=n=>'$'+n.toLocaleString('es-MX');
const stops=['Tapachula','Huixtla','Pijijiapan','Arriaga','Tuxtla Gutiérrez'];
const seg=[60,90,70,110];
const tipos={1:['Adulto',1],2:['Estudiante',.8],3:['INAPAM',.5]};
const sold=[[3,0,1],[5,0,4],[6,0,2],[9,1,4],[10,2,4],[14,0,4],[15,0,4],[17,1,3],[22,0,2],[23,3,4],[26,0,4],[31,0,4],[32,2,4],[36,0,1]];
const S={role:'taquillero',from:0,to:4,sel:[],tipo:1,pass:{},last:null,filter:'todos',tq:'Huixtla'};
const roles={taquillero:['Taquillero','ticket'],logistica:['Logística','bus'],admin:['Administrador','shield']};
const reserved=[[2,0,4],[11,1,3],[27,0,2]];
const nav=[
 ['dashboard','home','Inicio',['taquillero','logistica','admin'],'Operación'],
 ['buscar','search','Buscar viaje',['taquillero','admin'],'Operación'],
 ['venta','ticket','Vender boleto',['taquillero','admin'],'Operación'],
 ['boletos','eye','Boletos vendidos',['taquillero','admin'],'Operación'],
 ['manifiesto','list','Lista de pasajeros',['taquillero','logistica','admin'],'Operación'],
 ['viajes','cal','Programar viajes',['logistica','admin'],'Planeación'],
 ['rutas','route','Rutas y tarifas',['logistica','admin'],'Planeación'],
 ['unidades','bus','Unidades',['logistica','admin'],'Planeación'],
 ['logistica','wrench','Flota y despacho',['logistica','admin'],'Planeación'],
 ['terminales','build','Terminales y folios',['admin'],'Administración'],
 ['personal','id','Personal',['admin'],'Administración'],
 ['reportes','chart','Reportes',['admin'],'Administración'],
 ['infra','server','Infraestructura',['admin'],'Administración'],
 ['usuarios','users','Usuarios y roles',['admin'],'Administración']
];
const titles={dashboard:'Inicio',buscar:'Buscar viaje',venta:'Vender boleto',boleto:'Boleto emitido',boletos:'Boletos vendidos',manifiesto:'Lista de pasajeros',viajes:'Programar viajes',rutas:'Rutas y tarifas',unidades:'Unidades',logistica:'Flota y despacho',terminales:'Terminales y folios',personal:'Personal',reportes:'Reportes',infra:'Infraestructura',usuarios:'Usuarios y roles'};

const occ=(s,d,h)=>sold.some(([x,a,b])=>x===s&&d<b&&a<h);
const res=(s,d,h)=>reserved.some(([x,a,b])=>x===s&&d<b&&a<h);
const fare=(a,b)=>seg.slice(a,b).reduce((x,y)=>x+y,0);
const sw=(on,label)=>`<button class="sw" role="switch" aria-checked="${on}" aria-label="${label}" data-act="sw"></button>`;
const price=()=>Math.round(seg.slice(S.from,S.to).reduce((a,b)=>a+b,0)*tipos[S.tipo][1]);
function toast(m,k){const t=$('#toast');t.innerHTML=(k==='bad'?ic('alert'):ic('check'))+'<span>'+m+'</span>';t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
const route=()=>(location.hash||'#login').slice(1);

/* ---------- vistas ---------- */
const V={};
V.login=()=>`<div class="hero">
  <div class="brand" style="padding:0"><div class="logo" style="background:rgba(255,255,255,.16)">${ic('bus','l')}</div><div><b style="color:#fff">Zaca</b><span style="color:#cdd9ff">Tapachula · Tuxtla Gutiérrez</span></div></div>
  <div><h1>Cada asiento, en el tramo exacto.</h1><p>Vende boletos entre paradas intermedias sin sobreventas, aunque una taquilla pierda conexión.</p></div>
  <svg class="route" viewBox="0 0 520 260" fill="none"><path d="M20 230C120 230 120 120 220 130S330 60 420 70 500 30 500 30" stroke="#ffffff55" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
   ${[[20,230,'Tapachula'],[160,160,'Huixtla'],[290,100,'Pijijiapan'],[420,70,'Arriaga'],[500,30,'Tuxtla']].map(([x,y,n])=>`<circle cx="${x}" cy="${y}" r="9" fill="#F59E0B" stroke="#fff" stroke-width="3"/><text x="${x-8}" y="${y+28}" fill="#fff" font-size="13" font-family="Work Sans">${n}</text>`).join('')}</svg>
</div>
<div class="formside"><form class="formbox" onsubmit="event.preventDefault();enter()">
  <div><h1>Bienvenida</h1><p class="mut">Inicia sesión con tu usuario de taquilla.</p></div>
  <div class="field"><label for="u">Usuario</label><input id="u" class="in" value="taquilla.huixtla" autocomplete="username"></div>
  <div class="field"><label for="p">Contraseña</label><input id="p" class="in" type="password" value="12345678" autocomplete="current-password"></div>
  <div class="field"><label>Entrar como</label><div class="roles" role="radiogroup">
   ${Object.entries(roles).map(([k,[n,i]])=>`<button type="button" role="radio" aria-checked="${S.role===k}" class="rolebtn ${S.role===k?'on':''}" data-act="role" data-v="${k}">${ic(i)}${n}</button>`).join('')}</div></div>
  <button class="btn acc" style="min-height:48px">Entrar ${ic('arrow','s')}</button>
  <p class="sm mut" style="text-align:center">Tu rol define qué pantallas ves y qué puedes escribir en la base de datos.</p>
</form></div>`;

V.dashboard=()=>{
  const h=[4,6,12,18,26,31,24,19,22,28,34,29,21,14,9,5];
  const mx=Math.max(...h);
  return `<div class="head"><div><h1>Buen día, Michelle</h1><p>Resumen de hoy · ${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</p></div>
  ${S.role!=='logistica'?`<button class="btn acc" data-act="go" data-v="buscar">${ic('plus','s')}Nueva venta</button>`:''}</div>
  <div class="g g4" style="margin-bottom:18px">
  ${[['ticket','Boletos vendidos','248','+12% vs ayer'],['trend','Ingresos','$43,820','+8% vs ayer'],['bus','Ocupación media','78%','12 salidas hoy'],['server','Replicación','0.4 s','retraso entre nodos']].map(([i,t,v,s])=>`<div class="card kpi"><div class="t"><span class="ib">${ic(i)}</span>${t}</div><div class="v num">${v}</div><div class="sm mut">${s}</div></div>`).join('')}</div>
  <div class="g g-8-4">
   <div class="card"><div class="ch"><h2>Ventas por hora</h2><span class="chip info">Hoy</span></div>
    <svg viewBox="0 0 640 220" style="width:100%" role="img" aria-label="Ventas por hora, pico a las 16 horas">
     ${[0,1,2,3].map(i=>`<line x1="30" x2="630" y1="${20+i*50}" y2="${20+i*50}" stroke="var(--line)"/>`).join('')}
     ${h.map((v,i)=>{const bh=v/mx*160,x=40+i*37;return `<rect x="${x}" y="${180-bh}" width="24" height="${bh}" rx="6" fill="${v===mx?'var(--acc)':'var(--pri-2)'}" opacity="${v===mx?1:.75}"/><text x="${x+12}" y="205" text-anchor="middle" font-size="11" fill="var(--mut)">${6+i}h</text>`}).join('')}
    </svg></div>
   <div class="card"><div class="ch"><h2>Próximas salidas</h2></div>
    ${[['08:00','Tapachula → Tuxtla',82],['09:30','Huixtla → Arriaga',55],['11:00','Tapachula → Tuxtla',34],['13:30','Pijijiapan → Tuxtla',12]].map(([t,r,o])=>`<div style="margin-bottom:16px"><div class="sum" style="padding:0 0 6px"><b class="h num">${t}</b><span class="sm mut">${r}</span></div><div class="bar"><i style="width:${o}%"></i></div><div class="sm mut" style="margin-top:4px">${o}% ocupado</div></div>`).join('')}</div>
  </div>
  <div class="card" style="margin-top:18px"><div class="ch"><h2>Actividad reciente</h2></div><div class="tl">
   ${[['ok','Boleto #00412 vendido · asiento 7, Huixtla → Tuxtla','hace 2 min'],['warn','Intento de doble venta bloqueado · asiento 7','hace 2 min'],['ok','Unidad 12 asignada al viaje de las 08:00','hace 14 min'],['bad','Unidad 07 rechazada: mantenimiento preventivo','hace 31 min']].map(([k,t,w])=>`<div><span class="d ${k}"></span><div style="flex:1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>${t}</span><span class="sm mut">${w}</span></div></div>`).join('')}</div></div>`;
};

V.buscar=()=>`<div class="head"><div><h1>Buscar viaje</h1><p>Origen y destino pueden ser cualquier parada de la ruta.</p></div></div>
 <div class="card" style="margin-bottom:18px"><div class="row" style="align-items:flex-end">
  <div class="field"><label>Origen</label><select class="in" id="bo">${stops.map((s,i)=>`<option value="${i}" ${i===S.from?'selected':''}>${s}</option>`).join('')}</select></div>
  <button class="btn ghost ico" style="flex:0 0 44px;min-width:44px" data-act="swap" aria-label="Invertir">${ic('swap')}</button>
  <div class="field"><label>Destino</label><select class="in" id="bd">${stops.map((s,i)=>`<option value="${i}" ${i===S.to?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="field"><label>Fecha</label><input class="in" type="date" value="2026-10-25"></div>
  <button class="btn" style="flex:0 0 auto" data-act="find">${ic('search','s')}Buscar</button></div></div>
 <div class="g">${[['08:00','13:10','Directo',180,12],['11:00','16:20','Ordinario',150,26],['13:30','18:40','Directo',180,31]].map(([a,b,t,p,l],i)=>`
  <div class="card trip"><div><div class="time num">${a}</div><div class="sm mut">llega ${b}</div></div>
   <div><div class="line">${stops.map((s,k)=>`<span class="${k===S.from||k===S.to?'e':''}">${s.split(' ')[0]}</span>`).join('')}</div>
    <div style="margin-top:14px;display:flex;gap:8px"><span class="chip info">${t}</span><span class="chip">${ic('bus','s')}Unidad ${['12','21','12'][i]}</span><span class="chip ${l<15?'warn':'ok'}">${l} asientos libres</span></div></div>
   <div style="text-align:right"><div class="price num">${money(p)}</div><div class="sm mut" style="margin-bottom:10px">por pasajero</div><button class="btn acc" data-act="go" data-v="venta">Elegir asientos</button></div></div>`).join('')}</div>`;

V.venta=()=>{
  const seatNo=(r,c)=>r*4+c;
  const total=price()*S.sel.length;
  return `<div class="head"><div><h1>Vender boleto</h1><p>Tapachula → Tuxtla · 25 oct · 08:00 · Unidad 12</p></div>
   <div class="tabs"><span class="tab on">1 · Asientos</span><span class="tab">2 · Pasajero</span><span class="tab">3 · Cobro</span></div></div>
  <div class="card" style="margin-bottom:18px"><div class="ch"><h2>Detalle del viaje</h2><span class="chip ok"><span class="dot"></span>Abordando en 40 min</span></div>
   <div class="g g-8-4" style="align-items:center">
    <div class="trip-d"><div><small>Unidad</small><b>12</b></div><div><small>Placa</small><b>CHS-482-B</b></div><div><small>Servicio</small><b>Directo</b></div><div><small>Conductor</small><b>R. Velázquez</b></div><div><small>Relevo</small><b>J. Castillo</b></div><div><small>Andén</small><b>4</b></div></div>
    <div class="cnt">${(()=>{let o=0,rv=0;for(let n=1;n<=40;n++){if(occ(n,S.from,S.to))o++;else if(res(n,S.from,S.to))rv++}return [['Libres',40-o-rv,'var(--ok)'],['Vendidos',o,'var(--ink)'],['Reservados',rv,'var(--warn)']].map(([t,v,c])=>`<div><span class="sm mut">${t}</span><b class="num" style="color:${c}">${v}</b></div>`).join('')})()}</div>
   </div><p class="sm mut" style="margin-top:10px">Los contadores cambian según el tramo elegido.</p></div>
  <div class="g g-7-5">
   <div class="card"><div class="ch"><h2>Elige tu tramo</h2><span class="chip info">${stops[S.from]} → ${stops[S.to]}</span></div>
    <div class="stops">${stops.map((s,i)=>`<button class="stp ${i>S.from&&i<=S.to?'in':''} ${i===S.from||i===S.to?'end on':''}" data-act="stop" data-v="${i}"><b></b>${s}</button>`).join('')}</div>
    <p class="sm mut">Toca dos paradas. Un asiento ocupado de Tapachula a Huixtla puede venderse de Huixtla a Tuxtla.</p>
    <div class="busbox"><div class="cab"><span>${ic('user','s')} Conductor</span><span>Frente</span></div>
     <div class="seats">${[...Array(10).keys()].map(r=>[1,2,0,3,4].map(c=>{if(!c)return'<span></span>';const n=seatNo(r,c),o=occ(n,S.from,S.to),rv=!o&&res(n,S.from,S.to),s=S.sel.includes(n);
      return `<button class="seat ${s?'sel':''} ${rv?'res':''}" ${o||rv?'disabled':''} data-act="seat" data-v="${n}" aria-label="Asiento ${n} ${o?'ocupado':rv?'reservado':s?'seleccionado':'libre'}" aria-pressed="${s}">${n}</button>`}).join('')).join('')}</div></div>
    <div class="legend"><span><i style="border-color:var(--seat-free-b);background:var(--seat-free)"></i>Libre</span><span><i style="border-color:var(--pri);background:var(--pri)"></i>Seleccionado</span><span><i style="border-color:var(--seat-res-b);background:var(--seat-res)"></i>Reservado</span><span><i style="border-color:var(--seat-occ-b);background:var(--seat-occ)"></i>Ocupado en este tramo</span></div></div>
   <div class="g" style="align-content:start">
    <div class="card"><div class="ch"><h2>Pasajero</h2></div><div class="g" style="gap:12px">
     <div class="field"><label>Nombre completo</label><input class="in" data-f="name" value="${S.pass.name||''}" placeholder="Como aparece en su identificación"></div>
     <div class="field"><label>CURP o identificación</label><input class="in" data-f="curp" value="${S.pass.curp||''}" placeholder="18 caracteres"></div>
     <div class="field"><label>Tipo de pasajero</label><select class="in" data-f="tipo">${Object.entries(tipos).map(([k,[n,d]])=>`<option value="${k}" ${+k===S.tipo?'selected':''}>${n}${d<1?' · '+Math.round((1-d)*100)+'% desc.':''}</option>`).join('')}</select></div></div></div>
    <div class="card"><div class="ch"><h2>Resumen</h2></div>
     <div class="sum"><span class="mut">Asientos</span><b>${S.sel.length?S.sel.sort((a,b)=>a-b).join(', '):'—'}</b></div>
     <div class="sum"><span class="mut">Tarifa por asiento</span><b class="num">${money(price())}</b></div>
     <div class="sum t"><span>Total</span><span class="num">${money(total)}</span></div>
     <button class="btn acc" style="width:100%;margin-top:14px;min-height:48px" data-act="confirm" ${S.sel.length?'':'disabled'}>${ic('check','s')}Confirmar venta</button>
     <button class="btn ghost" style="width:100%;margin-top:8px" data-act="toast" data-v="Asientos apartados 30 min. Si no se pagan, se liberan solos." ${S.sel.length?'':'disabled'}>${ic('clock','s')}Reservar 30 min</button>
     <p class="sm mut" style="margin-top:10px">${ic('shield','s')} La base de datos impide la doble venta aunque dos taquillas confirmen al mismo tiempo.</p></div>
   </div></div>`;
};

V.boleto=()=>{
  const L=S.last||{seats:[7],from:0,to:4,total:230,name:'Ana Pérez López',folio:'00413'};
  const qr=(()=>{let x=+L.folio||7,o='';for(let r=0;r<21;r++)for(let c=0;c<21;c++){const f=(r<7&&(c<7||c>13))||(r>13&&c<7);x=(x*1103515245+12345)&0x7fffffff;if(f){const e=(r%14<7?r%14:r-14),cc=c<7?c:c-14;if((e===0||e===6||cc===0||cc===6)||(e>=2&&e<=4&&cc>=2&&cc<=4))o+=`<rect x="${c*5}" y="${r*5}" width="5" height="5"/>`}else if(x%3===0)o+=`<rect x="${c*5}" y="${r*5}" width="5" height="5"/>`}return o})();
  return `<div class="head"><div><h1>Venta confirmada</h1><p>El boleto quedó registrado en el nodo primario y se replica al secundario.</p></div>
   <div style="display:flex;gap:10px"><button class="btn ghost" onclick="window.print()">${ic('print','s')}Imprimir</button><button class="btn acc" data-act="go" data-v="buscar">${ic('plus','s')}Nueva venta</button></div></div>
  <div class="ticket"><div class="l">
   <div class="tk-h"><div class="brand" style="padding:0"><div class="logo">${ic('bus','l')}</div><div><b>Zaca</b><span>Boleto de pasajero</span></div></div><span class="chip ok">${ic('check','s')}Vigente</span></div>
   <div class="tk-route"><div><small class="mut sm">Origen</small><div class="c">${stops[L.from]}</div></div>${ic('arrow','l')}<div><small class="mut sm">Destino</small><div class="c">${stops[L.to]}</div></div></div>
   <div class="tk-grid"><div><small>Pasajero</small><b>${L.name||'Pasajero'}</b></div><div><small>Salida</small><b>25 oct · 08:00</b></div><div><small>Asiento</small><b>${L.seats.join(', ')}</b></div><div><small>Unidad</small><b>12</b></div><div><small>Folio</small><b class="num">#${L.folio}</b></div><div><small>Total</small><b class="num">${money(L.total)}</b></div></div></div>
   <div class="r"><div class="qr"><svg viewBox="0 0 105 105" width="150" height="150" fill="#0F1B3D">${qr}</svg></div><span class="sm mut">Escanear al abordar</span></div></div>`;
};

V.boletos=()=>{
  const data=[['00412','Ana Pérez López','7','Huixtla → Tuxtla','$150','vigente'],['00411','Luis Gómez Ruiz','12','Tapachula → Arriaga','$220','abordado'],['00410','Rosa Díaz','3','Huixtla → Pijijiapan','$90','vigente'],['00409','Carlos Mena','21','Tapachula → Tuxtla','$330','cancelado'],['00408','María Solís','8','Pijijiapan → Tuxtla','$180','abordado'],['00407','Jorge Vera','30','Tapachula → Huixtla','$60','vigente']];
  const chip={vigente:'info',abordado:'ok',cancelado:'bad'};
  return `<div class="head"><div><h1>Boletos vendidos</h1><p>Solo puedes cancelar boletos vigentes de tu taquilla.</p></div></div>
  <div class="card"><div class="row" style="margin-bottom:14px;align-items:center"><div class="tabs" style="flex:2">${['todos','vigente','abordado','cancelado'].map(f=>`<button class="tab ${S.filter===f?'on':''}" data-act="filter" data-v="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>

/* ---------- router ---------- */
function render(){
  let r=route();
  const isLogin=r==='login';
  $('#login').hidden=!isLogin;$('#app').hidden=isLogin;
  if(isLogin){$('#login').innerHTML=V.login();return}
  const allowed=nav.filter(n=>n[3].includes(S.role)).map(n=>n[0]).concat(['boleto']);
  if(!V[r]||!allowed.includes(r)){r='dashboard';history.replaceState(null,'','#dashboard')}
  $('#nav').innerHTML=nav.filter(n=>n[3].includes(S.role)).map(([id,i,l,,g],k,a)=>(k===0||a[k-1][4]!==g?`<div class="nav-l">${g}</div>`:'')+`<a data-act="go" data-v="${id}" class="${r===id||(r==='boleto'&&id==='venta')?'on':''}" ${r===id?'aria-current="page"':''}>${ic(i)}<span>${l}</span></a>`).join('');
  $('#urole').textContent=roles[S.role][0];
  $('#view').innerHTML='<div class="view">'+V[r]()+'</div>';
  document.title=titles[r]+' · Zaca';
  window.scrollTo(0,0);
}
function enter(){location.hash='#dashboard'}
addEventListener('hashchange',render);

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const v=a.dataset.v;
  switch(a.dataset.act){
    case'go':location.hash='#'+v;break;
    case'role':S.role=v;render();break;
    case'theme':setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');break;
    case'toast':toast(v);break;case'toastbad':toast(v,'bad');break;
    case'swap':{[S.from,S.to]=[S.to,S.from];if(S.from>=S.to){S.from=0;S.to=4}render();break}
    case'find':{const f=+$('#bo').value,t=+$('#bd').value;if(f>=t)return toast('El destino debe estar después del origen','bad');S.from=f;S.to=t;render();break}
    case'stop':{const i=+v;if(i<S.from)S.from=i;else if(i>S.from)S.to=i;else break;S.sel=S.sel.filter(n=>!occ(n,S.from,S.to)&&!res(n,S.from,S.to));render();break}
    case'seat':{const n=+v;S.sel=S.sel.includes(n)?S.sel.filter(x=>x!==n):[...S.sel,n].slice(-4);render();break}
    case'confirm':{S.last={seats:[...S.sel],from:S.from,to:S.to,total:price()*S.sel.length,name:S.pass.name,folio:String(413+Math.floor(Math.random()*50)).padStart(5,'0')};S.sel=[];S.pass={};location.hash='#boleto';break}
    case'filter':S.filter=v;render();break;
    case'ruta':S.ruta=+v;render();break;
    case'pf':S.pf=v;render();break;
    case'sw':a.setAttribute('aria-checked',a.getAttribute('aria-checked')!=='true');break;
  }
});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='tipo'){S.tipo=+e.target.value;render()}else S.pass[f]=e.target.value});

function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zaca-theme',t)}catch(_){}const u=$('#themeic use');if(u)u.setAttribute('href',t==='dark'?'#i-sun':'#i-moon')}
let saved=null;try{saved=localStorage.getItem('zaca-theme')}catch(_){}
setTheme(saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
render();
</script>
